[package]
name = "flat_message_proc_macro"
version = "0.2.1"
edition = "2021"
authors = ["Gavrilut Dragos <gavrilut.dragos@gmail.com>", "Andrei Damian <andreidaamian@gmail.com>"]
description = "Procedural macros for the FlatMessage serialization library."
license = "MIT"
repository = "https://github.com/gdt050579/FlatMessage"
readme = "../README.md"
keywords = ["serialization", "deserialize", "serialize", "zero-copy", "schema-less"]
categories = ["development-tools::procedural-macro-helpers"]
documentation = "https://docs.rs/flat_message_proc_macro"



[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0.101"
crc32fast = "1"

[lints]
workspace = true

[features]
smallvec = []   # no need to add a dependency here
